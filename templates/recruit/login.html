{% extends "base.html" %}
{% block title %}Recruiter login{% endblock %}
{% block content %}
<section class="card" style="max-width:420px;margin:2rem auto;">
  <h1>Recruiter login</h1>
  {% if error %}<p class="flash-err">{{ error }}</p>{% endif %}
  <form method="post" action="/recruit/login">
    <label>Password<input type="password" name="password" required autofocus></label>
    <p style="margin-top:1rem"><button class="btn" type="submit">Log in</button></p>
  </form>
  <p class="muted">Set <code>RECRUITER_PASSWORD</code> in your environment.</p>
</section>
{% endblock %}
