<!DOCTYPE html>
<html lang="en">

  <title>Talent Scout capture</title>

    body { font: 14px sans-serif; width: 320px; margin: 12px; }
    label { display: block; margin: 6px 0; }
    button { margin-top: 8px; }
  </style>
</head>
<body>
  <p>Select visible profiles on this tab. Cookies and passwords stay in the browser.</p>
